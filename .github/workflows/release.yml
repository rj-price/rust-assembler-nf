# Push a tag like v1.0.0 to publish a GitHub release. The tag must match manifest.version in
# nextflow.config, so `nextflow run rj-price/rust-assembler-nf -r v1.0.0` reports the version
# it claims to be.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches manifest.version
        run: |
          manifest=$(grep -E "^\s*version\s*=" nextflow.config | tail -1 | sed -E "s/.*'([^']+)'.*/\1/")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag manifest=$manifest"
          test "$tag" = "$manifest"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
